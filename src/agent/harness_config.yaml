# ============================================================
# Harness 工作流声明式配置（DSL）
# 将 Planning → Executing → Review → Result 四阶段与评审标准
# 从 prompts.py 中抽离，实现"改流程不改代码"。
# ============================================================

# 阶段定义（顺序即流转顺序，label 用于前端展示）
phases:
  - name: planning
    label: "规划中"
  - name: executing
    label: "执行中"
  - name: reviewing
    label: "审查中"
  - name: result
    label: "已完成"

# 评审器配置（由 RubricMiddleware 消费）
review:
  max_iterations: 3          # 单次 rubric 最多评审迭代次数
  # grader 独立模型（网关上的模型名）。留空/null 用主 LLM。
  # grader 是 create_agent + 结构化输出，用主模型（deepseek-v4.1-flash 推理型）
  # 单次评审要 20-40s 长推理才出判定；换 kimi-k2.6 后实测 ~4-7s、单次调用出判定。
  # 注意：minimax-m3 更快但会把 JSON 写在正文里而不走结构化输出工具，
  # 导致 grader 内部空转数十轮（实测 55 轮 / 210s），勿用。
  model: kimi-k2.6

# 任务类型识别关键词（用于自动选择 rubric）
task_types:
  release_tracking:
    keywords: [发版, 更新日志, changelog, releases, 版本]
  community_sentiment:
    keywords: [舆情, 热帖, 讨论, 社区, 评论]
  tech_report:
    keywords: [研报, 报告, 对比, 趋势, 分析]

# 各任务类型的评审标准（"什么算完成"）
# 技术情报类的硬校验：来源可追溯（source_url 必须真实存在于采集结果中）
rubrics:
  default: |
    1. 完整回答用户问题，未遗漏关键信息
    2. 所有数据均来自真实工具调用（mcp_browser_*），未编造
    3. 输出 Markdown，列表数据用表格
    4. 若目标域名被安全闸门拦截（domain_not_allowed / blocked_target 等错误码），如实向用户说明被拒原因与允许访问的域名范围即视为完成，不得反复重试或编造数据

  release_tracking: |
    1. 报告含至少 2 条可点击的来源 URL（http/https），且 URL 归属白名单域名
    2. 版本号、发布日期与采集到的页面内容逐项一致，无推测填充
    3. 引用了 mcp_extract_table 提取的真实表格数据，而非模型臆造版本序列

  community_sentiment: |
    1. 热帖/讨论条目附来源 URL，且可追溯到采集结果
    2. 热度判断有可量化依据（票数/评论数/时间分布），非主观断言
    3. 标注数据采集时间点

  tech_report: |
    1. 对比结论每条都能在 comparison_table 中找到数据支撑
    2. 明确标注数据采集时间点（技术情报有时效性）
    3. 未将不同来源的版本号混用比较
    4. 已调用 generate_document 生成研报文件，且最终回答包含 /api/download/ 可点击下载链接

# 可观测性配置
observability:
  trace_phase_transitions: true   # 是否持久化阶段流转 trace
