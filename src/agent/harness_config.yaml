# ============================================================
# Harness 工作流声明式配置（DSL）
# 将 Planning → Executing → Review → Result 四阶段与评审标准
# 从 prompts.py 中抽离，实现"改流程不改代码"。
# ============================================================

# 阶段定义（顺序即流转顺序，label 用于前端展示）
phases:
  - name: planning
    label: "规划中"
  - name: executing
    label: "执行中"
  - name: reviewing
    label: "审查中"
  - name: result
    label: "已完成"

# 评审器配置（由 RubricMiddleware 消费）
review:
  max_iterations: 1          # 单次 rubric 最多评审迭代次数（采购 demo 降噪：评审打回会造成重复建单）
  # grader 独立模型（网关上的模型名）。留空/null 用主 LLM。
  # grader 是 create_agent + 结构化输出，用主模型（deepseek-v4.1-flash 推理型）
  # 单次评审要 20-40s 长推理才出判定；换 kimi-k2.6 后实测 ~4-7s、单次调用出判定。
  # 注意：minimax-m3 更快但会把 JSON 写在正文里而不走结构化输出工具，
  # 导致 grader 内部空转数十轮（实测 55 轮 / 210s），勿用。
  model: kimi-k2.6

# 任务类型识别关键词（用于自动选择 rubric）
task_types:
  procurement_order:
    keywords: [下单, 采购, 订单, 新增订单, 修改订单, 创建订单, 审批, 收货, 发货]
  procurement_analysis:
    keywords: [分析, 对比, 统计, 趋势, 图表, 报表, 供应商, 元器件, 库存盘点]
  inventory_op:
    keywords: [入库, 出库, 盘点, 预警, 库存]

# 各任务类型的评审标准（"什么算完成"）
rubrics:
  default: |
    1. 已完成用户请求的核心操作
    2. 回答使用中文

  procurement_order: |
    1. 已调用订单工具（order_create / order_update / order_update_status）且返回 code=200
    2. 回答中包含订单编号与结果说明

  procurement_analysis: |
    1. 给出了分析结论
    2. 结论引用工具返回的数据

  inventory_op: |
    1. 入/出库操作返回 code=200

# 可观测性配置
observability:
  trace_phase_transitions: true   # 是否持久化阶段流转 trace
