# DEMO_MODE 下 webintel-mcp 的 guards._demo_rewrite() 把请求 host 改写成 mock-web，
# 原 URL 的 path/query 原样保留（见 webintel_mcp/guards.py）。因此这里不需要为
# github.com / news.ycombinator.com / arxiv.org 分别写 server 块——一个兜底 server
# 接管所有 Host，渲染哪个页面完全由 URL 路径决定，例如：
#   https://github.com/langchain-ai/langgraph/releases
#     -> http://mock-web/langchain-ai/langgraph/releases/
#     -> /usr/share/nginx/html/langchain-ai/langgraph/releases/index.html
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 目录补斜杠时的 301 用相对 Location，避免 nginx 把 Host/端口改写成 server_name
    # （默认 absolute_redirect on 会丢掉宿主机调试用的 :8080 端口）
    absolute_redirect off;

    location / {
        # 目录无尾斜杠时 nginx 会 301 补斜杠，Playwright 跟随重定向后仍停留在 mock-web
        # 域内（check_final_url 对该域放行，见 guards.py 的 DEMO_MODE 分支）
        try_files $uri $uri/ =404;
    }
}
